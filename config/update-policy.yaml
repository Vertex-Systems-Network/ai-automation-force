schema_version: 1
provider_scout:
  enabled: true
  cadence: daily
  timezone: Asia/Karachi
  preferred_local_time: "03:17"
  max_runtime_minutes: 12
  create_pr_only_when_material_change: true
  source_preference:
    - official-provider-docs
    - official-provider-pricing
    - official-provider-api-reference
    - official-provider-release-notes
    - official-provider-terms
    - official-platform-docs
  discovery:
    enabled: true
    require_search_adapter_for_new_provider_discovery: true
    default_new_provider_status: discovered
    default_routing_enabled: false
    never_enable_new_provider_without_adapter_tests: true
  evidence:
    official_source_required_for_registry_change: true
    minimum_sources_for_conflicting_fact: 2
    record_verified_at: true
    record_source_urls: true
    preserve_old_value: true
    confidence_levels: [low, medium, high]
  change_classes:
    A:
      description: research snapshots and evidence only
      auto_merge_allowed: true
    B:
      description: high-confidence provider/model/pricing/capability registry facts
      auto_merge_allowed: true
      requirements:
        - official-source-evidence
        - schema-validation
        - high-confidence
        - no-code-change
        - no-security-policy-change
        - no-schema-change
        - no-budget-policy-change
        - no-publishing-policy-change
    C:
      description: architecture and planning recommendations
      auto_merge_allowed: false
      review_required: true
    D:
      description: executable code schema migration security auth publishing budget or destructive behavior
      auto_merge_allowed: false
      full_ci_required: true
      review_required: true
  auto_merge:
    enabled: true
    strategy: squash
    fail_closed: true
    permitted_paths:
      - research/provider-updates/
      - memory/provider-source-state.json
      - config/provider-registry.yaml
    forbidden_paths:
      - .github/workflows/
      - automation/
      - ai-native/ENGINEERING-CONTRACT.md
      - schemas/
      - migrations/
      - apps/
      - packages/
      - infra/
    direct_merge_only_when_repository_rules_allow: true
    leave_pr_open_when_checks_or_permissions_block_merge: true
  secrets:
    allowed_secret_names:
      - GEMINI_API_KEY
      - TAVILY_API_KEY
      - BRAVE_SEARCH_API_KEY
      - PROVIDER_SCOUT_APP_TOKEN
    never_write_secret_values_to_artifacts: true
    github_token_minimum_permissions:
      contents: write
      pull_requests: write
  validation:
    registry_yaml_parse: true
    required_provider_evidence: true
    duplicate_provider_ids: reject
    unknown_access_class: reject
    invalid_url: reject
    material_change_required_for_pr: true
