[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ai-automation-force-api"
version = "0.1.0"
description = "FastAPI control plane for AI Automation Force"
requires-python = ">=3.12"
dependencies = [
  "ai-automation-force-core[persistence]==0.1.0",
  "fastapi==0.141.1",
  "temporalio==1.32.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8,<9",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
  "psycopg[binary]>=3.3.4,<4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ai_automation_force_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "postgres: requires the DATABASE_URL PostgreSQL integration database",
  "temporal: requires a Temporal dev/test server",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
