[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ai-automation-force-core"
version = "0.1.0"
description = "Provider-neutral core domain contracts for AI Automation Force"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.8,<3",
]

[project.optional-dependencies]
persistence = [
  "sqlalchemy>=2.0.52,<2.1",
  "psycopg>=3.3.4,<4",
]
storage = [
  "boto3==1.43.83",
  "botocore==1.43.83",
]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
  "sqlalchemy>=2.0.52,<2.1",
  "alembic>=1.19.1,<1.20",
  "psycopg[binary]>=3.3.4,<4",
  "boto3==1.43.83",
  "botocore==1.43.83",
  "types-boto3[s3]==1.43.83",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lullabies_core", "src/ai_automation_force_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "postgres: requires the DATABASE_URL PostgreSQL integration database",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
