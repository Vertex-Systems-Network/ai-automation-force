name: M01 WP2 Schema Materialize

on:
  push:
    branches:
      - "m01/wp2-lineage-fixtures"
    paths:
      - "packages/python-core/**"
      - "schemas/**"
      - ".github/workflows/m01-wp2-schema-materialize.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: "!contains(github.event.head_commit.message, '[schema-materialize]')"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: m01/wp2-lineage-fixtures

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install core package
        run: python -m pip install -e "packages/python-core[dev]"

      - name: Export deterministic schemas
        run: python packages/python-core/scripts/export_schemas.py

      - name: Commit generated schema changes when needed
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- schemas/generated)" ]]; then
            echo "No generated schema changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add schemas/generated
          git commit -m "schema: materialize WP2 lineage contracts [schema-materialize]"
          git push origin HEAD:m01/wp2-lineage-fixtures
