name: Daily AI Provider Scout

on:
  schedule:
    - cron: "17 3 * * *"
      timezone: "Asia/Karachi"
  workflow_dispatch:

concurrency:
  group: provider-scout
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  scout:
    name: Research provider changes
    # Secret-bearing AI research must stay on a GitHub-hosted runner. Do not
    # redirect this job to a repository-variable-selected self-hosted runner.
    runs-on: ubuntu-24.04
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: automation/requirements-scout.txt

      - name: Install scout dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r automation/requirements-scout.txt

      - name: Unit tests
        run: python -m unittest discover -s automation/tests -p "test_*.py" -v

      - name: Validate provider scout configuration
        run: python automation/provider_scout.py --validate

      - name: Run provider scout
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PROVIDER_SCOUT_MODEL: ${{ vars.PROVIDER_SCOUT_MODEL || 'gemini-2.5-flash-lite' }}
        run: python automation/provider_scout.py

      - name: Independent evidence and classification gate
        run: |
          rm -f .provider-scout-automerge-safe
          python automation/validate_provider_update.py

      - name: Classify repository changes
        id: changes
        shell: bash
        run: |
          if [[ -f .provider-scout-automerge-safe ]]; then
            echo "lower_risk=true" >> "$GITHUB_OUTPUT"
          else
            echo "lower_risk=false" >> "$GITHUB_OUTPUT"
          fi
          rm -f .provider-scout-automerge-safe

          git status --short
          if [[ -z "$(git status --porcelain -- config/provider-registry.yaml memory/provider-source-state.json research/provider-updates/)" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Revalidate changed registry
        if: steps.changes.outputs.changed == 'true'
        run: python automation/provider_scout.py --validate

      - name: Create update branch and commit
        if: steps.changes.outputs.changed == 'true'
        id: commit
        shell: bash
        run: |
          branch="automation/provider-scout-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          git config user.name "lullabies-provider-scout[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add config/provider-registry.yaml memory/provider-source-state.json research/provider-updates/
          git commit -m "chore(providers): refresh AI provider research"

      - name: Push update branch with short-lived credentials
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PROVIDER_SCOUT_APP_TOKEN || github.token }}
          BRANCH: ${{ steps.commit.outputs.branch }}
        run: |
          set -euo pipefail
          gh auth setup-git
          git push origin "$BRANCH"

      - name: Open pull request
        if: steps.changes.outputs.changed == 'true'
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PROVIDER_SCOUT_APP_TOKEN || github.token }}
          HEAD_BRANCH: ${{ steps.commit.outputs.branch }}
        run: |
          pr_url="$(gh pr create \
            --base main \
            --head "$HEAD_BRANCH" \
            --title 'chore(providers): daily AI provider research update' \
            --body 'Automated daily provider research. Evidence and change classification are stored under research/provider-updates/. Registry changes remain human-review-only because model output and externally retrieved content are untrusted inputs. New provider integrations, architecture changes, schemas, security, publishing, and budget behavior are never auto-enabled by this scout.')"
          echo "url=$pr_url" >> "$GITHUB_OUTPUT"
          echo "$pr_url"

      - name: Report lower-risk update requiring human review
        if: steps.changes.outputs.changed == 'true' && steps.changes.outputs.lower_risk == 'true'
        run: |
          echo "Independent checks classified this as lower risk, but AI-generated/external-content-derived changes are never auto-merged. Human review is required."

      - name: Report review-required update
        if: steps.changes.outputs.changed == 'true' && steps.changes.outputs.lower_risk != 'true'
        run: |
          echo "Provider scout found a higher-risk or otherwise review-required change. PR remains open by design."

      - name: No material change
        if: steps.changes.outputs.changed != 'true'
        run: echo "No material provider/API change detected; no PR created."
