name: M01 Materialize Schemas

on:
  push:
    branches:
      - "m01/wp1-contract-freeze"
    paths:
      - "packages/python-core/**"
      - ".github/workflows/m01-materialize-schemas.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: "!contains(github.event.head_commit.message, '[schema-materialized]')"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m01/wp1-contract-freeze

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/python-core/pyproject.toml

      - name: Install core package
        run: python -m pip install -e "packages/python-core[dev]"

      - name: Generate schemas
        run: python packages/python-core/scripts/export_schemas.py

      - name: Commit generated schemas when changed
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- schemas/generated)" ]]; then
            echo "Generated schemas already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add schemas/generated
          git commit -m "chore: materialize M01 generated schemas [schema-materialized]"
          git push origin HEAD:m01/wp1-contract-freeze
