name: Durable Control Plane

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "apps/worker/**"
      - "packages/python-core/**"
      - "packages/contracts/**"
      - ".github/workflows/control-plane.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - "apps/worker/**"
      - "packages/python-core/**"
      - "packages/contracts/**"
      - ".github/workflows/control-plane.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_automation_force_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_automation_force_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/ai_automation_force_test
      AAF_ENVIRONMENT: test
      AAF_BUILD_REVISION: ci
      AAF_TEMPORAL_TARGET: 127.0.0.1:7233
      AAF_TEMPORAL_NAMESPACE: default
      AAF_TEMPORAL_TASK_QUEUE: aaf-control-v1
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            packages/python-core/pyproject.toml
            apps/api/pyproject.toml
            apps/worker/pyproject.toml

      - name: Install core, API and worker
        run: >-
          python -m pip install
          -e "packages/python-core[dev]"
          -e "apps/api[dev]"
          -e "apps/worker[dev]"

      - name: Install pinned Temporal CLI
        run: |
          curl --fail --silent --show-error --location \
            --output /tmp/temporal-cli.tar.gz \
            https://github.com/temporalio/cli/releases/download/v1.8.2/temporal_cli_1.8.2_linux_amd64.tar.gz
          echo "d8421bda989e6514b4bdb4d63a9012a8a05a806892e881a5aad8510496349a94  /tmp/temporal-cli.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/temporal-cli.tar.gz -C /tmp
          /tmp/temporal --version

      - name: Start pinned Temporal dev server
        run: |
          nohup /tmp/temporal server start-dev --ip 127.0.0.1 > /tmp/temporal.log 2>&1 &
          echo $! > /tmp/temporal.pid
          python - <<'PY'
          import socket
          import time

          deadline = time.time() + 30
          while time.time() < deadline:
              try:
                  with socket.create_connection(("127.0.0.1", 7233), timeout=1):
                      print("Temporal dev server is ready on 127.0.0.1:7233")
                      break
              except OSError:
                  time.sleep(0.5)
          else:
              raise SystemExit("Temporal dev server did not become ready within 30 seconds")
          PY

      - name: Ruff
        run: ruff check packages/python-core apps/api apps/worker

      - name: Mypy
        run: >-
          mypy
          packages/python-core/src
          packages/python-core/scripts
          packages/python-core/migrations
          apps/api/src
          apps/api/scripts
          apps/worker/src

      - name: Unit, PostgreSQL and Temporal integration tests
        run: pytest packages/python-core/tests apps/api/tests apps/worker/tests

      - name: Verify generated core schemas are synchronized
        run: python packages/python-core/scripts/export_schemas.py --check

      - name: Verify deterministic OpenAPI generation
        run: |
          python apps/api/scripts/export_openapi.py --output /tmp/control-plane-v1.json
          cp /tmp/control-plane-v1.json /tmp/control-plane-v1.first.json
          python apps/api/scripts/export_openapi.py --output /tmp/control-plane-v1.json
          cmp /tmp/control-plane-v1.first.json /tmp/control-plane-v1.json

      - name: Compile core, API, worker and migrations
        run: >-
          python -m compileall -q
          packages/python-core/src
          packages/python-core/migrations
          apps/api/src
          apps/worker/src

      - name: Show Temporal log on failure
        if: failure()
        run: cat /tmp/temporal.log || true

      - name: Stop Temporal dev server
        if: always()
        run: |
          if [ -f /tmp/temporal.pid ]; then
            kill "$(cat /tmp/temporal.pid)" || true
          fi
