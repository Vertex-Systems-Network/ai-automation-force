name: M01 Ruff Autofix

on:
  push:
    branches:
      - "m01/wp1-contract-freeze"
    paths:
      - "packages/python-core/**"
      - ".github/workflows/m01-ruff-autofix.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  autofix:
    if: "!contains(github.event.head_commit.message, '[ruff-autofix]')"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m01/wp1-contract-freeze

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: python -m pip install "ruff>=0.6,<1"

      - name: Apply safe Ruff fixes
        run: |
          ruff check --fix packages/python-core
          ruff format packages/python-core

      - name: Commit formatting fixes when changed
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- packages/python-core)" ]]; then
            echo "No Ruff fixes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/python-core
          git commit -m "style: apply M01 Ruff fixes [ruff-autofix]"
          git push origin HEAD:m01/wp1-contract-freeze
