name: Core Domain Contracts

on:
  push:
    branches: [main]
    paths:
      - "packages/python-core/**"
      - "schemas/**"
      - ".github/workflows/core-contracts.yml"
  pull_request:
    paths:
      - "packages/python-core/**"
      - "schemas/**"
      - ".github/workflows/core-contracts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/python-core/pyproject.toml

      - name: Install core package
        run: python -m pip install -e "packages/python-core[dev]"

      - name: Ruff
        run: ruff check packages/python-core

      - name: Mypy
        run: mypy packages/python-core/src packages/python-core/scripts

      - name: Unit tests
        run: pytest packages/python-core/tests

      - name: Verify generated schemas are synchronized
        run: python packages/python-core/scripts/export_schemas.py --check

      - name: Compile package
        run: python -m compileall -q packages/python-core/src
