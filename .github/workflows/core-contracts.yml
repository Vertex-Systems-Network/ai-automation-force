name: Core Domain Contracts

on:
  push:
    branches: [main]
    paths:
      - "packages/python-core/**"
      - "schemas/**"
      - ".github/workflows/core-contracts.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: core-domain-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_automation_force_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_automation_force_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/ai_automation_force_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/python-core/pyproject.toml

      - name: Install core package
        run: python -m pip install -e "packages/python-core[dev]"

      - name: Ruff
        run: ruff check packages/python-core

      - name: Mypy
        run: mypy packages/python-core/src packages/python-core/scripts packages/python-core/migrations

      - name: Unit and PostgreSQL integration tests
        run: pytest packages/python-core/tests

      - name: Verify generated schemas are synchronized
        run: python packages/python-core/scripts/export_schemas.py --check

      - name: Compile package and migrations
        run: >-
          python -m compileall -q
          packages/python-core/src
          packages/python-core/migrations
