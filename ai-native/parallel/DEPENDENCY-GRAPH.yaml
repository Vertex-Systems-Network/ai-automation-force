    note: executable test/security changes still require applicable ownership and consent

rules:
  - This registry describes dependency readiness and never grants development consent.
  - Supervisor updates it before assigning newly unblocked executable work.
  - Independent planning lanes may run in parallel where repository governance permits.
  - Do not serialize independent work only because milestone numbers are sequential.
  - Contract-owner branches promote before consumers that depend on those contracts.
  - A newly merged contract/governance rule may mark affected branches sync-required before they resume.
  - Branch existence is not evidence that executable work is authorized.
